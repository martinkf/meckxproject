[OptionTitles]
DevScreen=dev test screen

[OptionExplanations]
DevScreen=dev test screen

[MenuPauseTitles]
Continue=Resume Song
Restart=Restart Song
Return=Return to Select Music
Skip=Skip to Evaluation

[MenuPauseDescs]
Continue=Resume the Gameplay where you left off.
Restart=Restart the Song from the beginning.
Return=Returns to the song selection screen.
Skip=Finish the Stage and send directly to the Evaluation screen.

[ProfileAction]
SetSaniNetPlayerKey =Assign the SANINET Keycard to this profile
SetSaniNetPlayerTypeKeyboard =Set this profile as SANINET Keyboard Player
SetSaniNetPlayerTypeArcade =Set this profile as SANINET Arcade / USB Pad Player
