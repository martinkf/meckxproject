SwitchSeconds=0.17
RandomPicksLockedSongs=false
UseSectionsWithGroupGroup=false
OnlyShowActiveSection=true
HideActiveSectionTitle=true
ScrollBarHeight=360
ScrollBarOnCommand=visible,false
ItemTransformFunction=function(self,offsetFromCenter,itemIndex,numItems) \
	local x = offsetFromCenter * 350 \
	if offsetFromCenter >= 2 then \
		x = x - (offsetFromCenter - 2) * -50 \
	elseif offsetFromCenter <= -2 then \
		x = x - (offsetFromCenter + 2) * -50 \
	end \
	self:x( x ) \
	self:z((-clamp(math.abs(offsetFromCenter),0,1)*390)-math.abs(offsetFromCenter)) \
	self:y(20) \
	self:rotationy( clamp( offsetFromCenter, -1, 1) * 40 + clamp( offsetFromCenter, -2, 2) * 0.5 + clamp( offsetFromCenter, -3, 3) * 1.0) \
	self:diffusealpha( 1 - math.abs(offsetFromCenter)/3.5 )  \
	self:zoom( clamp( math.abs(offsetFromCenter),1.0, 1.0)) \
end;
