[MusicWheel]
FadeSeconds=0
SwitchSeconds=0.05
RandomPicksLockedSongs=false
UseSectionsWithGroupGroup=false
OnlyShowActiveSection=true
HideActiveSectionTitle=true
ScrollBarHeight=300
ScrollBarOnCommand=visible,false
ItemTransformFunction = function(self, OffsetFromCenter) \
	local absOffset = math.abs(OffsetFromCenter)		 \
	local offsetSign = OffsetFromCenter < 0 and -1 or 1	 \
	local spacingX = 147	 \
	local xpos = OffsetFromCenter * spacingX	 \
	local yOffset = 0	 \
	if absOffset > 0 then	 \
        yOffset = (absOffset / math.pow(absOffset, 0.5)) * 13	 \
    end	 \
		self:xy(xpos,(math.min(absOffset, 1)*6) + yOffset)	 \
		self:z(absOffset*-34)	 \
		self:rotationx(-54 * math.min(absOffset, 1)) \
	local baseZoom = 1	 \
    local sideZoom = 0.76	 \
    local minZoom = 0.75	 \
	local zoomFactor = sideZoom - math.min((absOffset - 1) * 0.1, sideZoom - minZoom)	 \
	if absOffset <= 1 then	 \
		zoomFactor = baseZoom - (absOffset * (baseZoom - sideZoom))	 \
	end	 \
		self:zoom(zoomFactor)	 \
	self:diffusealpha( math.max(math.min(5-absOffset,1),0) )		 \
end;
NumWheelItems=15
MusicWheelSortOnCommand=
MusicWheelSortOffCommand=
MusicWheelItemSortOnCommand=
MusicWheelItemSortOffCommand=
HighlightOnCommand=
HighlightOffCommand=
